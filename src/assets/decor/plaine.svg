<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice" class="calque calque-plaine" aria-hidden="true" focusable="false">
  <!-- Calque de la plaine, au premier plan : prairie, champs, chemin, maison et petits détails -->

  <!-- Prairie -->
  <path class="c-herbe" d="M0 840 C 260 800, 560 815, 800 830 C 1040 845, 1320 805, 1600 815 L1600 1000 L0 1000 Z" />

  <!-- Pré fauché à gauche, avec ses sillons -->
  <g class="pre">
    <path class="c-herbe-clair" d="M0 905 C 140 885, 300 888, 430 900 L380 1000 L0 1000 Z" />
    <path class="trait-herbe" d="M40 902 L20 1000 M120 894 L108 1000 M200 891 L198 1000 M280 892 L290 1000 M360 896 L376 990" />
  </g>

  <!-- Champ de blé à droite, avec ses rangées -->
  <g class="champ">
    <path class="c-champ" d="M960 880 C 1160 855, 1380 860, 1600 868 L1600 1000 L1080 1000 C 1050 960, 1000 915, 960 880 Z" />
    <path class="trait-champ-fonce" d="M1010 884 Q 1060 940 1120 1000 M1090 877 Q 1170 940 1240 1000 M1180 871 Q 1260 935 1360 1000 M1270 868 Q 1360 930 1480 1000 M1370 866 Q 1460 925 1600 990 M1470 866 Q 1540 900 1600 925" />
  </g>

  <!-- Chemin qui part vers la montagne -->
  <path class="c-champ-clair" d="M700 1000 C 740 950, 880 935, 850 895 C 825 865, 845 845, 856 836 L870 836 C 865 848, 850 865, 878 893 C 915 935, 860 960, 910 1000 Z" />

  <!-- Arbres de la plaine -->
  <g class="arbres">
    <use href="#arbre" transform="translate(395 852) scale(1.25)" />
    <use href="#arbre" transform="translate(465 846) scale(0.95)" />
    <use href="#arbre" transform="translate(1180 852) scale(1.05)" />
    <use href="#arbre" transform="translate(1490 852) scale(1.3)" />
    <use href="#arbre" transform="translate(1555 868) scale(0.9)" />
  </g>

  <!-- La maison -->
  <g class="maison">
    <!-- Fumée de la cheminée (animée) -->
    <g class="fumee">
      <circle class="c-nuage" cx="677" cy="734" r="9" />
      <circle class="c-nuage" cx="685" cy="712" r="12" />
      <circle class="c-nuage" cx="694" cy="686" r="15" />
    </g>
    <!-- Cheminée, dessinée avant le toit pour que le toit cache sa base -->
    <rect class="c-roche" x="668" y="752" width="18" height="40" />
    <rect class="c-roche-fonce" x="664" y="746" width="26" height="8" rx="2" />
    <!-- Murs et toit en ardoise, comme les maisons pyrénéennes -->
    <rect class="c-nuage" x="575" y="800" width="120" height="72" />
    <rect class="c-nuage-ombre" x="575" y="806" width="120" height="6" />
    <polygon class="c-roche-fonce" points="556,808 635,742 714,808" />
    <!-- Lucarne ronde -->
    <circle class="c-ciel-clair trait-bois-fonce" cx="635" cy="784" r="9" />
    <!-- Fenêtres avec volets et jardinières fleuries -->
    <rect class="c-bois" x="581" y="820" width="6" height="24" />
    <rect class="c-bois" x="617" y="820" width="6" height="24" />
    <rect class="c-ciel-clair trait-bois-fonce" x="590" y="821" width="24" height="22" />
    <rect class="c-bois" x="647" y="820" width="6" height="24" />
    <rect class="c-bois" x="683" y="820" width="6" height="24" />
    <rect class="c-ciel-clair trait-bois-fonce" x="656" y="821" width="24" height="22" />
    <rect class="c-bois-fonce" x="587" y="845" width="30" height="6" rx="2" />
    <rect class="c-bois-fonce" x="653" y="845" width="30" height="6" rx="2" />
    <use href="#fleur" class="c-accent" transform="translate(593 843) scale(0.6)" />
    <use href="#fleur" class="c-nuage" transform="translate(602 842) scale(0.6)" />
    <use href="#fleur" class="c-accent" transform="translate(611 843) scale(0.6)" />
    <use href="#fleur" class="c-nuage" transform="translate(659 843) scale(0.6)" />
    <use href="#fleur" class="c-accent" transform="translate(668 842) scale(0.6)" />
    <use href="#fleur" class="c-nuage" transform="translate(677 843) scale(0.6)" />
    <!-- Porte arrondie et sa poignée -->
    <path class="c-accent-fonce" d="M623 872 V844 a12 12 0 0 1 24 0 V872 Z" />
    <circle class="c-champ" cx="642" cy="859" r="2.2" />
  </g>

  <!-- Clôtures de part et d'autre de la maison -->
  <g class="cloture">
    <rect class="c-bois" x="466" y="872" width="104" height="5" rx="2" />
    <rect class="c-bois" x="466" y="884" width="104" height="5" rx="2" />
    <rect class="c-bois" x="700" y="872" width="104" height="5" rx="2" />
    <rect class="c-bois" x="700" y="884" width="104" height="5" rx="2" />
    <path class="c-bois-clair" d="M470 896 V868 l4 -6 l4 6 V896 Z M496 896 V868 l4 -6 l4 6 V896 Z M522 896 V868 l4 -6 l4 6 V896 Z M548 896 V868 l4 -6 l4 6 V896 Z M704 896 V868 l4 -6 l4 6 V896 Z M730 896 V868 l4 -6 l4 6 V896 Z M756 896 V868 l4 -6 l4 6 V896 Z M782 896 V868 l4 -6 l4 6 V896 Z" />
  </g>

  <!-- Panneau en bois qui indique le sommet -->
  <g class="panneau">
    <rect class="c-bois-fonce" x="912" y="836" width="8" height="62" rx="2" />
    <polygon class="c-bois-clair" points="842,824 858,808 982,808 982,838 858,838" />
    <text class="panneau-texte" x="920" y="829" text-anchor="middle">Aneto 3 404 m</text>
  </g>

  <!-- Bottes de foin dans le champ -->
  <g class="bottes">
    <use href="#botte" transform="translate(1215 930)" />
    <use href="#botte" transform="translate(1300 958) scale(1.1)" />
    <use href="#botte" transform="translate(1435 925)" />
    <use href="#botte" transform="translate(1535 952) scale(1.15)" />
  </g>

  <!-- Fleurs semées dans la prairie -->
  <g class="fleurs">
    <use href="#fleur" class="c-nuage" transform="translate(40 872)" />
    <use href="#fleur" class="c-accent" transform="translate(130 862)" />
    <use href="#fleur" class="c-nuage" transform="translate(215 878)" />
    <use href="#fleur" class="c-champ-clair" transform="translate(300 866)" />
    <use href="#fleur" class="c-accent" transform="translate(380 882)" />
    <use href="#fleur" class="c-nuage" transform="translate(500 930)" />
    <use href="#fleur" class="c-accent" transform="translate(560 962)" />
    <use href="#fleur" class="c-champ-clair" transform="translate(625 915)" />
    <use href="#fleur" class="c-nuage" transform="translate(680 950)" />
    <use href="#fleur" class="c-accent" transform="translate(770 925)" />
    <use href="#fleur" class="c-nuage" transform="translate(1120 842)" />
    <use href="#fleur" class="c-accent" transform="translate(1260 838)" />
    <use href="#fleur" class="c-champ-clair" transform="translate(1380 846)" />
  </g>

  <!-- Hautes herbes : c'est ici que se cachera le campagnol -->
  <g class="hautes-herbes">
    <use href="#touffe" class="touffe c-herbe-fonce" transform="translate(945 985) scale(1.1)" />
    <use href="#touffe" class="touffe c-herbe-clair" transform="translate(972 992) scale(1.3)" />
    <use href="#touffe" class="touffe c-herbe" transform="translate(1000 988) scale(1)" />
    <use href="#touffe" class="touffe c-herbe-fonce" transform="translate(1024 994) scale(1.2)" />
  </g>
</svg>
