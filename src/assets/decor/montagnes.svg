<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice" class="calque calque-montagnes" aria-hidden="true" focusable="false">
  <!-- Calque des montagnes : chaîne lointaine, massif de l'Aneto, lisière de forêt -->

  <!-- Chaîne lointaine, plus claire car plus loin -->
  <g class="chaine-lointaine">
    <path class="c-roche-clair" d="M0 720 L0 560 L90 480 L170 530 L300 400 L420 500 L520 440 L600 480 L700 430 L800 470 L900 420 L1010 470 L1120 380 L1230 480 L1340 410 L1460 490 L1600 440 L1600 720 Z" />
    <polygon class="c-nuage" points="300,400 336,430 320,426 308,438 294,426 270,430" />
    <polygon class="c-nuage" points="1120,380 1158,415 1142,410 1128,422 1112,410 1077,415" />
    <polygon class="c-nuage" points="1340,410 1385,440 1368,436 1352,448 1336,436 1293,440" />
  </g>

  <!-- Massif de l'Aneto : le sommet principal au centre, un second sommet à droite -->
  <g class="massif">
    <path class="c-roche" d="M360 720 L520 500 L600 430 L650 395 L705 425 L820 170 L935 325 L985 300 L1060 245 L1165 415 L1230 520 L1300 720 Z" />

    <!-- Faces à l'ombre (côté droit de chaque sommet) -->
    <polygon class="c-roche-fonce" points="650,395 705,425 700,560 660,720 620,720 655,520" />
    <polygon class="c-roche-fonce" points="820,170 935,325 960,420 930,720 850,720 840,450" />
    <polygon class="c-roche-fonce" points="1060,245 1165,415 1230,520 1300,720 1120,720 1100,480" />

    <!-- Neige des sommets, avec une ombre bleutée côté droit -->
    <polygon class="c-nuage" points="820,170 890,265 868,254 852,276 834,258 816,282 798,262 777,265" />
    <polygon class="c-nuage-ombre" points="820,170 890,265 868,254 852,276 838,262" />
    <polygon class="c-nuage" points="1060,245 1084,285 1070,279 1056,293 1040,279 1005,285" />
    <polygon class="c-nuage" points="650,395 677,410 666,412 655,422 643,412 621,415" />

    <!-- Glacier de l'Aneto, le plus grand des Pyrénées, sur la face nord -->
    <polygon class="c-nuage" points="852,276 868,254 890,265 915,300 925,360 905,345 895,400 880,370 865,420 858,350" />
    <polygon class="c-nuage-ombre" points="890,265 915,300 925,360 905,345 900,300" />
  </g>

  <!-- Lisière de forêt au pied de la montagne -->
  <g class="foret">
    <path class="c-herbe-fonce" d="M0 700 C 180 650, 360 690, 560 665 C 760 640, 960 690, 1160 660 C 1360 630, 1480 680, 1600 660 L1600 1000 L0 1000 Z" />
