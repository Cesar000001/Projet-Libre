<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice" class="calque calque-ciel" aria-hidden="true" focusable="false">
  <!-- Calque du ciel : soleil, nuages et oiseaux (le dégradé bleu du ciel est fait en CSS) -->

  <!-- Soleil : un halo clair et un disque jaune -->
  <g class="soleil">
    <circle class="soleil-halo c-champ-clair" cx="1290" cy="240" r="100" />
    <circle class="c-champ" cx="1290" cy="240" r="72" />
  </g>

  <!-- Nuages : le groupe extérieur bouge (animation), le groupe intérieur fixe la position et la taille.
       Chaque nuage = la forme en ombre bleutée + la même forme blanche décalée vers le haut. -->
  <g class="nuage">
    <g transform="translate(250 230)">
      <use href="#forme-nuage" class="c-nuage-ombre" />
      <use href="#forme-nuage" class="c-nuage" y="-8" />
    </g>
  </g>
  <g class="nuage">
    <g transform="translate(700 175) scale(0.7)">
      <use href="#forme-nuage" class="c-nuage-ombre" />
      <use href="#forme-nuage" class="c-nuage" y="-8" />
    </g>
  </g>
  <g class="nuage">
    <g transform="translate(1460 400) scale(0.7)">
      <use href="#forme-nuage" class="c-nuage-ombre" />
      <use href="#forme-nuage" class="c-nuage" y="-8" />
    </g>
  </g>
  <g class="nuage">
    <g transform="translate(120 430) scale(0.5)">
      <use href="#forme-nuage" class="c-nuage-ombre" />
      <use href="#forme-nuage" class="c-nuage" y="-8" />
    </g>
  </g>

  <!-- Trois petits oiseaux au loin -->
  <g class="oiseaux">
    <path class="oiseau" d="M880 270 q 7 -8 14 0 q 7 -8 14 0" />
    <path class="oiseau" d="M918 250 q 6 -7 12 0 q 6 -7 12 0" />
    <path class="oiseau" d="M945 280 q 5 -6 10 0 q 5 -6 10 0" />
  </g>
</svg>
