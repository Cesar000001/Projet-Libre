<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Un bestiaire interactif des animaux des Pyrénées, de la vallée aux sommets."
    />
    <!-- Le favicon est dans public/ : il est servi tel quel à la racine du site -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Le Bestiaire des Pyrénées</title>
  </head>
  <body>
    <!-- Décor : rempli par scene.js avec les calques SVG de src/assets/decor/ -->
    <div class="scene" aria-hidden="true"></div>

    <main>
      <!-- Introduction : présentation du site et bouton de départ -->
      <section class="intro" aria-labelledby="titre-site">
        <div class="intro-panneau">
          <h1 id="titre-site" class="intro-titre">Le Bestiaire des Pyrénées</h1>
          <p class="intro-texte">
            Grimpe de la vallée jusqu'au sommet de l'Aneto, à 3&nbsp;404&nbsp;m, et pars à la
            rencontre des animaux qui vivent à chaque étage de la montagne.
          </p>
          <div class="intro-action">
            <button class="bouton" type="button">Débuter l'aventure</button>
          </div>
        </div>
      </section>

      <!-- Indice affiché après l'introduction -->
      <p class="indice">
        Fais défiler pour grimper
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
      </p>
    </main>

    <!-- Point d'entrée JavaScript : Vite part de ce fichier pour charger tout le reste -->
    <script type="module" src="/src/scripts/main.js"></script>
  </body>
</html>
